# Generate the Xcode project with `xcodegen` in this folder. Both apps compile the same sources in PDFLibrary/.
# Signing: see docs/SIGNING.md. Unsigned builds work with CODE_SIGNING_ALLOWED=NO.
name: PDFLibrary
options:
  bundleIdPrefix: com.aditya
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
settings:
  base:
    DEVELOPMENT_TEAM: M9K2GT5S6F
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    # One App ID and one iCloud container for every platform.
    PRODUCT_BUNDLE_IDENTIFIER: com.aditya.pdflibrary
    INFOPLIST_KEY_CFBundleDisplayName: PDF Library
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # iCloud sync needs the CloudKit entitlement. Unsigned builds (CODE_SIGNING_ALLOWED=NO) carry no
    # entitlements, so pass PDFL_CLOUD_SYNC=NO with them; the app then runs as a local-only library.
    PDFL_CLOUD_SYNC: YES
  configs:
    # The CloudKit environment the build talks to: Xcode-signed Debug builds use Development, while
    # archives exported for TestFlight and the App Store use Production. The app keeps separate sync
    # state per environment (see SyncController.activate).
    Debug:
      PDFL_CLOUD_ENVIRONMENT: Development
    Release:
      PDFL_CLOUD_ENVIRONMENT: Production
targets:
  PDFLibraryMac:
    type: application
    platform: macOS
    sources:
      - PDFLibrary
    entitlements:
      path: Platform/macOS/PDFLibrary.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.network.client: true
        com.apple.developer.aps-environment: development
        com.apple.developer.icloud-container-identifiers: [iCloud.com.aditya.pdflibrary]
        com.apple.developer.icloud-services: [CloudKit]
    info:
      path: Platform/macOS/Info.plist
      properties:
        CFBundleDisplayName: PDF Library
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        PDFLCloudSync: $(PDFL_CLOUD_SYNC)
        PDFLCloudEnvironment: $(PDFL_CLOUD_ENVIRONMENT)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
    settings:
      base:
        PRODUCT_NAME: PDF Library
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
  PDFLibraryiOS:
    type: application
    platform: iOS
    sources:
      - PDFLibrary
    entitlements:
      path: Platform/iOS/PDFLibrary.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers: [iCloud.com.aditya.pdflibrary]
        com.apple.developer.icloud-services: [CloudKit]
    info:
      path: Platform/iOS/Info.plist
      properties:
        CFBundleDisplayName: PDF Library
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        PDFLCloudSync: $(PDFL_CLOUD_SYNC)
        PDFLCloudEnvironment: $(PDFL_CLOUD_ENVIRONMENT)
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        UIApplicationSupportsIndirectInputEvents: true
        # "Open in PDF Library" / Share → PDF Library imports a copy; the original stays where it was.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: PDF Library
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
